name: aws-login
description: >
  Assume an AWS role via OIDC and mask every organization identifier in the
  logs. Run it before any step whose inputs hold those identifiers.

inputs:
  role-to-assume:
    required: true
  aws-region:
    required: true

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        mask-aws-account-id: true

    # Masks apply to all later output, including later steps' input headers.
    - name: Mask organization identifiers
      shell: bash
      run: |
        set -euo pipefail
        mask() { local v; for v in "$@"; do if [ -n "$v" ] && [ "$v" != None ]; then echo "::add-mask::$v"; fi; done; }
        mask_ous() { local ou; for ou in $(aws organizations list-organizational-units-for-parent --parent-id "$1" --query 'OrganizationalUnits[].Id' --output text); do mask "$ou"; mask_ous "$ou"; done; }
        mask $(aws organizations list-accounts --query 'Accounts[].Id' --output text)
        mask "$(aws organizations describe-organization --query Organization.Id --output text)"
        for root in $(aws organizations list-roots --query 'Roots[].Id' --output text); do
          mask "$root"
          mask_ous "$root"
        done
        while IFS=$'\t' read -r instance store; do
          mask "${instance##*/}" "$store"
          while IFS=$'\t' read -r id name; do mask "$id" "$name"; done < <(
            aws identitystore list-groups --identity-store-id "$store" --query 'Groups[].[GroupId,DisplayName]' --output text)
          while IFS=$'\t' read -r id name; do mask "$id" "$name"; done < <(
            aws identitystore list-users --identity-store-id "$store" --query 'Users[].[UserId,UserName]' --output text)
          for ps in $(aws sso-admin list-permission-sets --instance-arn "$instance" --query 'PermissionSets[]' --output text); do
            mask "${ps##*/}"
          done
        done < <(aws sso-admin list-instances --query 'Instances[].[InstanceArn,IdentityStoreId]' --output text)
